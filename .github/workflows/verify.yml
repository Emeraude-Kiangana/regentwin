name: Verify RegenTwin Gate 0

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify sample twin
        run: python -m regentwin.verify twins/PLOT-001
      - name: Run tests
        run: python -m unittest discover -s tests -v
